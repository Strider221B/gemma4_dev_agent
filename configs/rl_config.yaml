# RL Training Configuration
# Version: 1.0.0

model:
  name: "google/gemma-4-31b-it-qat-w4a16-ct"
  adapter_path: "/kaggle/working/checkpoints/sft_lora"
  max_seq_length: 32768

mode: "grpo"  # "grpo" or "dpo"

grpo:
  # Generation
  num_generations: 4
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 0.95
  lora_r: 32

  # KL penalty
  beta: 0.1

  # Training
  num_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  max_grad_norm: 0.5

  # Safety
  max_trajectory_tokens: 28672
  discard_truncated: true

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  max_length: 28672
  max_prompt_length: 4096
  num_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6

# Reward model
reward:
  pass_reward: 1.0
  fail_reward: -0.5
  efficiency_bonus_max: 0.15
  truncation_penalty: -0.2
  length_penalty_threshold: 24000

output_dir: "/kaggle/working/checkpoints"
log_path: "/kaggle/working/logs/run_rl.log"
