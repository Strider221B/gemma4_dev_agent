[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swegemma-agent"
version = "0.1.0"
description = "Post-training pipeline for gemma-4-31b-it-qat-w4a16-ct as an autonomous SWE agent"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "networkx>=3.0",
    "datasets>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
training = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.12",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "safetensors",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["src"]

[[tool.mypy.overrides]]
module = [
    "bitsandbytes.*",
    "trl.*",
    "peft.*",
    "transformers.*",
    "datasets.*",
    "networkx.*",
    "sklearn.*",
    "safetensors.*",
    "torch.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml -v"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
